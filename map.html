<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}if(!t){t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();</script>
  <title>خريطة السياحة في عُمان | اكتشف عُمان</title>
  <meta name="description" content="خريطة تفاعلية لكل الوجهات السياحية في سلطنة عُمان مع الوصف والاتجاهات.">
  <meta name="theme-color" content="#f7f2ea">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_OM">
  <meta property="og:title" content="خريطة السياحة في عُمان | اكتشف عُمان">
  <meta property="og:description" content="خريطة تفاعلية لكل الوجهات السياحية في سلطنة عُمان مع الوصف والاتجاهات.">
  <meta property="og:image" content="images/grand-mosque.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-rail" data-page="map">
  <div id="site-header"></div>

  <div class="map-layout">
    <div class="map-wrap" id="mapwrap">
      <div id="bigmap"></div>
      <div class="map-fab">
        <button class="btn light small" id="locate" type="button">موقعي</button>
        <button class="btn light small" id="reset" type="button">↺ إعادة الضبط</button>
      </div>
    </div>

    <aside class="map-side">
      <div class="map-tools">
        <input type="search" id="mq" placeholder="ابحث عن وجهة…" aria-label="بحث">
        <select id="mgov" aria-label="المحافظة"></select>
        <div class="legend" id="mcats"></div>
        <div class="result-count" id="mcount"></div>
        <div class="note" id="locmsg" style="display:none"></div>
      </div>
      <div class="map-list" id="mlist"></div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/mapcore.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
